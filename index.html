    <!-- Appareil trop ancien (ex. iPad sous iOS < 13.4) : message clair plutôt qu'une page blanche -->
    <script>
      (function () {
        var ok = true;
        try {
          new Function(
            'var o = null; var a = o ?? 1; var f = async () => { await 0; }; return [[a]].flatMap(function (x) { return x; })',
          )();
          new RegExp('\\p{L}', 'u');
          ok = !!(window.Promise && window.Set && window.Map && Object.assign && Array.from && window.localStorage !== undefined);
        } catch (e) {
          ok = false;
        }
        if (ok) return;
        window.DEVOIRS_TOO_OLD = true;
        var app = document.getElementById('app'),
          bar = document.querySelector('.topbar');
        if (bar) bar.style.display = 'none';
        app.innerHTML =
          '<div class="card" style="max-width:560px;margin:40px auto;text-align:center"><div style="font-size:4rem">🦫</div>' +
          '<h1>Cet appareil est trop ancien pour cette application…</h1>' +
          '<p>Son navigateur ne comprend pas le code de « Mes devoirs ». Essayez de mettre l’appareil à jour ' +
          '(iPad/iPhone : iOS 13.4 ou plus récent), ou ouvrez le site sur un autre appareil ou un autre navigateur.</p></div>';
      })();
    </script>
